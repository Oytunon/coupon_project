# Alembic Configuration File
# =========================
# Database URL is configured in env.py from environment variables
# Do NOT set sqlalchemy.url here

[alembic]
# Migration script directory
script_location = alembic

# Prepend project root to sys.path
prepend_sys_path = .

# Database URL will be set dynamically in env.py from settings
# Leave this line commented or with a placeholder
# sqlalchemy.url = driver://user:pass@localhost/dbname

[logging]
# these sections for logging configuration
# are processed by the ConfigParser module.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
