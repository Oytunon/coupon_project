services:
  api:
    build:
      context: .
      dockerfile: backend_api/Dockerfile
    container_name: coupon_api_prod
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./media_data:/app/media

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: coupon_worker_prod
    restart: always
    env_file:
      - .env

  reward_worker:
    build:
      context: .
      dockerfile: Dockerfile.reward_worker
    container_name: coupon_reward_worker_prod
    restart: always
    env_file:
      - .env
  # Frontends are deployed to Vercel
