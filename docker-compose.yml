# Docker Compose for Coupon Project

services:
  postgres:
    image: postgres:16
    container_name: coupon_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: coupon_db
      POSTGRES_USER: coupon_user
      POSTGRES_PASSWORD: coupon_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U coupon_user -d coupon_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend_api/Dockerfile
    container_name: coupon_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://coupon_user:coupon_pass@postgres:5432/coupon_db
    env_file:
      - .env
    volumes:
      - ./backend_api:/app/backend_api
      - ./shared:/app/shared
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: coupon_worker
    environment:
      - DATABASE_URL=postgresql://coupon_user:coupon_pass@postgres:5432/coupon_db
    env_file:
      - .env
    volumes:
      - ./worker:/app/worker
      - ./shared:/app/shared
    depends_on:
      postgres:
        condition: service_healthy

  admin-frontend:
    build:
      context: admin_frontend
      dockerfile: Dockerfile
    container_name: coupon_admin_frontend
    ports:
      - "3001:80"
    depends_on:
      - api

  client-frontend:
    build:
      context: client_frontend
      dockerfile: Dockerfile
    container_name: coupon_client_frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
